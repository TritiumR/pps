# Single config for the minimal_base pipeline (--task minimal_base --config vlm_mpc/configs/base.yaml).
# All tunable parameters live here; the task reads them. Per-run overrides on the CLI: --exp_name/--seed/--ground.
# Copy this file for a variant (e.g. base_ddim.yaml) rather than editing in place.

run:
  exp_name: minimal_base
  seed: 1
  max_chunks: 50
  fps: 20

grounding:
  source: gt            # gt | rekep_fake
  grasp_obj: pear       # gt grounding: object to grasp
  place_obj: scale      # object to place onto
  task_key: weight      # perception/VLM grounding task
  seat_dist: 0.03       # gripper closes when TCP within this of the target (m)
  commit_hold: 5        # closed frames before a grasp commits to the next stage
  clearance: 0.015      # rekep: placement clearance above the surface (m)
  release_tol: 0.05     # rekep: place-stage advance tolerance (m)

engine:
  real_stats: true      # faithful pi05_droid_jointpos quantile decode
  interpolate: true     # coarse-knot horizon interpolation
  horizon: 15
  exec_knot: 8          # chunk steps executed before re-planning
  mode: denoise         # denoise | mean
  update: score_space   # score_space | ddim | mbd_score | flow
  init: warm            # warm | noise
  warm_steps: 6         # warm init: run only the last N reverse steps (SDEdit)
  denoise_iters: 10
  score_scale: 0.3
  joint_delta_clip: 0.05   # post-decode per-step joint-motion cap (safety rate-limit)
  basis: bspline        # linear | cubic | bspline | rbf
  knots: 4

sampler:
  num_samples: 512
  iterations: 8
  noise: 0.35
  temperature: 0.15     # DIAL softmax temperature

cost:                   # weights (soft by design) + gripper/collision geometry (m)
  orientation: 3.0
  consistency: 30.0
  straddle: 15.0
  collision: 20.0
  floor: 40.0
  task: 25.0            # ReKep relational constraint (J_task) weight
  path: 200.0           # running path-constraint weight
  ee_r: 0.035           # gripper collision radius
  coll_clear: 0.02      # keepout margin beyond the object extent
  finger_r: 0.012       # fingertip radius
  open_half: 0.04       # gripper half-span
