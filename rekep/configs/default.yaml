# ReKep front-end config for the IsaacLab port: keypoint proposal, VLM constraint
# generation, and the subgoal-pose solver.

device: &device cuda
seed: &seed 0

# World-frame workspace box for filtering keypoint candidates. Fallback values;
# normally overridden per scene at runtime from the object poses.
bounds_min: &bounds_min [-2.0, -2.0, 0.0]
bounds_max: &bounds_max [12.0, 2.0, 2.0]
margin: 0.6   # padding added around the scene objects when deriving those bounds

keypoint_proposer:
  num_candidates_per_mask: 5    # candidate keypoints clustered per object mask
  min_dist_bt_keypoints: 0.06   # merge keypoints closer than this (m)
  max_mask_ratio: 0.5           # skip masks covering more than this fraction of the image
  dino_model: dinov2_vits14     # DINOv2 backbone (any dinov2_vit{s,b,l,g}14; patch size is 14)
  device: *device
  bounds_min: *bounds_min
  bounds_max: *bounds_max
  seed: *seed

constraint_generator:   # VLM that writes the relational constraints
  model: gpt-4o
  temperature: 0.0
  max_tokens: 2048

subgoal_solver:   # optimizes the next end-effector subgoal pose
  sampling_maxfun: 2000   # global-search evaluation budget
  minimizer_options:
    maxiter: 200          # local refinement iterations
