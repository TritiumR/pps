# vlm_driven + LOCAL grasp affordance: identical to vlm_driven.yaml except the grasp centre + extent come
# from the cloud NEAR the VLM grasp keypoint (a gripper-aperture ball), not the whole-object centroid. This
# lets the base grasp a PART of a large segmented object -- the coffee-maker LID lip is grasped at the lip
# (not the machine's deep body centre, which closes on air), and its thin local extent makes the pinch terms
# satisfiable (a press-hook across the lip). Only the `grounding:` block is added; the cost is unchanged.

cost:
  terms:
    reach: 8.0
    terminal_reach: 40.0
    rekep_subgoal: 30.0
    rekep_path: 200.0
    smooth: 5.04
    joint_delta: 3.5
    orientation: 8.0
    straddle: 30.0
    clear: 0.1
    floor: 40.0
    tip_z: 80.0
    yaw: 5.0
    grasp_axis: 15.0
    center_region: 120.0
    aperture_region: 80.0
    close_gripper: 2.0
    carry_hold: 40.0
    carry_clear: 150.0
    carry_altitude: 40.0
    place_setdown: 100.0
    release_gripper: 40.0
    gripper_smooth: 0.5
  geometry:
    ee_r: 0.035
    coll_clear: 0.02
    finger_r: 0.012
    open_half: 0.04
    tool_back: 0.06
    tcp_to_tip: 0.0
    center_scale: 0.40
    close_z_scale: 0.025
    close_xy_floor: 0.008
    aperture_margin: 0.006
    subgoal_mean: true
    release_on_subgoal: false
    release_xy: 0.06
    release_z: 0.02
    place_release_clearance: 0.012
    place_descend_radius: 0.10
    carry_altitude_clear: 0.12
    clear_max_radius: 0.10
    carry_clear_margin: 0.05

# Grounding-level: grasp the object at the LOCAL affordance near the VLM keypoint (the lid lip), with a
# feasibility extent from that local cloud, instead of the whole-object centroid + whole-object extent.
grounding:
  local_grasp: true
  local_grasp_radius: 0.05   # aperture-scaled ball (~open_half + margin) around the VLM keypoint

advance:
  mode: subgoal
  flag_fallback: false
