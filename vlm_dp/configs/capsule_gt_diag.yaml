# Capsule GT-keypoint DIAGNOSTIC: de-confound perception/occlusion from the downstream cost/control.
# Identical driven cost + LOCAL grasp as vlm_driven_localgrasp.yaml, but keypoints come from GT part poses
# (grounding.kp_source: gt) and the plan from the capsule fake-VLM. So the question is isolated to: given a
# keypoint correctly on the lid lip (+ pod + bay), does the DRIVEN cost grasp the lip and open the lid + seat
# the pod? Pair with --vlm_cost rekep_fake_vlm --vlm_state gt. NOT the honest base -- a privileged rung.

cost:
  terms:
    reach: 8.0
    terminal_reach: 40.0
    rekep_subgoal: 30.0
    rekep_path: 200.0
    smooth: 5.04
    joint_delta: 3.5
    orientation: 8.0
    straddle: 30.0
    clear: 0.1
    floor: 40.0
    tip_z: 80.0
    yaw: 5.0
    grasp_axis: 15.0
    center_region: 120.0
    aperture_region: 80.0
    close_gripper: 2.0
    carry_hold: 40.0
    carry_clear: 150.0
    carry_altitude: 40.0
    place_setdown: 100.0
    release_gripper: 40.0
    gripper_smooth: 0.5
  geometry:
    ee_r: 0.035
    coll_clear: 0.02
    finger_r: 0.012
    open_half: 0.04
    tool_back: 0.06
    tcp_to_tip: 0.0
    center_scale: 0.40
    close_z_scale: 0.025
    close_xy_floor: 0.008
    aperture_margin: 0.006
    subgoal_mean: true
    release_on_subgoal: false
    release_xy: 0.06
    release_z: 0.02
    place_release_clearance: 0.012
    place_descend_radius: 0.10
    carry_altitude_clear: 0.12
    clear_max_radius: 0.10
    carry_clear_margin: 0.05

grounding:
  local_grasp: true          # grasp AT the GT lid keypoint (the lip), not the whole-machine centroid
  local_grasp_radius: 0.05
  kp_source: gt              # keypoints from GT part poses (occlusion-free) -- the diagnostic switch

advance:
  mode: subgoal
  flag_fallback: false
