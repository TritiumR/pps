# simple_auth -- simple_pred plus PLAN-AUTHORITATIVE stage transitions. Terms, weights and
# subgoal_eps 0.12 are byte-identical to simple_pred; the only change is advance.plan_authoritative.
#
# Evidence (motion_pred_go, 10 seeds): 8/10 seeds spent 375-384 of their ~400 replans in the LIFT
# stage and timed out at the 1600-step budget having placed nothing (seeds 2,3,4,5,6,7,8,10; the
# two exceptions are seed 1, which lifted in 2 replans and succeeded, and seed 9, which stalled
# 383 replans in the apple grasp instead). The stall is not physical: the plan's own sub-goal for
# that stage read 0.000 (satisfied) throughout, and the shadow completion predicate agreed. It was
# the RUNTIME's own hold-branch rule, `_pos(payload).z >= stage.target().z - lift_tol`, that could
# not fire: after the one-sided lift rewrite, `stage.target()` for a move stage is the first
# keypoint mentioned in the constraint's SOURCE TEXT (rekep._vlm_stages), which for the lift stage
# is the payload's own surface keypoint -- so the test compares the payload's belief CENTRE with a
# SURFACE point of the same object and is off by a constant centre-to-surface offset at any height.
# Every run since that rewrite (settle_b, dd_vlm, dd_gate, pred_shadow, pred_go; all 0-1/10) is
# confounded by it.
#
#  3. PLAN-AUTHORITATIVE TRANSITIONS. advance.plan_authoritative makes every stage the plan
#     authored evidence for (a sub-goal constraint or a stage<N>_completion predicate) advance on
#     that evidence and nothing else: hold/move stages on stage.done() -- never the self-referential
#     z-test -- and place stages on the completion predicate (predicate_place_transitions below
#     folds in). GRASP stages deliberately keep the aperture certificate: "the fingers are stalled
#     on something of the expected width where the object is believed to be" is a PHYSICAL
#     measurement, not a geometric re-reading of the plan's prose, and the plan cannot observe a
#     grip. The text-order target() heuristic survives only as a COST target. A companion
#     advanceability preflight (rekep.advance_preflight) now synthesizes, once per episode, a state
#     satisfying each stage and refuses the episode if the active advance test cannot fire in it --
#     which is exactly how the above would have been caught before burning 50 minutes of GPU.
#
# Evidence (motion_pred_shadow, dd_gate + shadow completion predicates, 10 seeds): on ALL 139
# place-stage replans the stage4/8 completion component hand_let_go read 0.00 -- the gripper
# NEVER opens on a place stage -- while the scalar test (stage sub-goal < subgoal_eps 0.12)
# read "done" with the object still pinched on the scale. Two independent defects:
#
#  1. NO RELEASE COMMAND. carry_hold's shipped release gate here is release_commit_aniso: it
#     compares the MEASURED payload belief against a computed seat inside a 6cm/2cm ellipsoid
#     and then damps by release_step_motion_cap. Apple belief error is 25-75mm (median-p75),
#     so the ellipsoid test is inside the noise and effectively never certifies; the gripper
#     target stays 1.0 and carry_hold (weight 40) pins it shut. Switch to the opt-in
#     release_on_subgoal branch, which asks the VLM's OWN stage constraint instead:
#     ||payload_kp - (scale_kp + offset)||, a DIFFERENCE of two keypoints read from the same
#     perception frame, so a common-mode belief bias cancels and only relative error survives.
#     It is also evaluated per candidate (the payload keypoint rides the candidate gripper
#     pose), so it commands opening rather than merely permitting it.
#     subgoal_release_eps 0.10, pinned, chosen ONCE and not iterated: the apple belief error is
#     median 25mm / p75 75mm, so 0.10 = p75 error + ~25mm of seat/extent slack, and it sits
#     strictly BELOW grounding.subgoal_eps 0.12 so the open is commanded before the stage could
#     be considered finished. Setting this makes release_commit_aniso / release_step_motion_cap
#     inert for carry_hold (the subgoal branch returns first); they are kept for the record.
#
#  2. NO COMPLETION EVIDENCE. advance.predicate_place_transitions makes a PLACE stage advance
#     on the plan's stage<N>_completion predicate (hand let go AND object inside the place
#     region AND quiescent AND descended) instead of the scalar sub-goal dip, which a still-
#     gripped object satisfies. Place stages only; every other stage type keeps its rule, and
#     the shadow logging stays on for all stages as the evidence trail.
cost:
  terms:
    rekep_subgoal: 100.0
    rekep_path: 100.0
    center_region: 120.0
    aperture_region: 80.0
    tip_z: 80.0
    grasp_standoff: 40.0
    close_gripper: 2.0
    carry_hold: 40.0
    # Protect the newly acquired grasp during the first second of lift.  This is
    # a motion prior only; the plan's height residual still owns stage advance.
    carry_accel: 40.0
    release_gripper: 40.0
    smooth: 50.4
    joint_delta: 35.0
    floor: 40.0
    straddle: 30.0
    orientation: 8.0
    yaw: 5.0
    grasp_axis: 15.0
  geometry:
    ee_r: 0.035
    coll_clear: 0.02
    finger_r: 0.012
    open_half: 0.04
    tool_back: 0.06
    tcp_to_tip: 0.0
    center_scale: 0.4
    grasp_dead_zone: proportional
    close_z_scale: 0.025
    # Plan-authored orient=tilt: broad near-horizontal band. It constrains
    # elevation only; yaw and the Cartesian path remain free.
    tilt_down_min: 0.0
    tilt_down_max: 0.5
    preshape_z: 0.025
    release_step_motion_cap: 0.004
    retreat_margin: 0.02
    retreat_clear: 0.04
    rise_first_span: 0.05
    rise_first_step: 0.01
    not_hold_sigma: 0.05
    carry_clear_include_placed: true
    carry_clear_margin: 0.005
    preshape_xy_tol: 0.02
    corridor_margin: 0.01
    grasp_approach_cap: 0.008
    grasp_brake_slope: 0.25
    grasp_descend_closing_only: true
    approach_hover: 0.08
    approach_xy_tol: 0.02
    close_xy_floor: 0.008
    aperture_margin: 0.006
    release_xy: 0.06
    release_z: 0.02
    place_approach_margin: 0.01
    release_on_subgoal: true     # carry_hold releases on the VLM stage constraint (see header)
    subgoal_release_eps: 0.10    # p75 apple belief error (75mm) + ~25mm slack, < subgoal_eps 0.12
    release_commit_aniso: true   # superseded by release_on_subgoal above (kept for the record)
    commit_measured_gate: true
    release_commit_band: 3.0
    place_descend_radius: 0.08
    place_release_clearance: 0.012
    clear_max_radius: 0.1
    subgoal_mean: true
    carry_accel_max: 2.0
    carry_accel_settle_s: 1.0
    carry_accel_z_weight: 1.0
advance:
  flag_fallback: false
  release_debug: true
  grasp_advance_on_hold: true
  ground_error_debug: true
  # Thin-handle contact may cross the air threshold before its 12-step settling window closes.
  thin_feature_contact_ratio: 0.5
  thin_feature_width_band: 0.08    # reject a wide lid-edge stall as a thin-handle grasp
  thin_feature_loss_ratio: 0.8       # confirmed thin grasp: only near-free close counts as loss
  thin_feature_loss_grace_replans: 2 # tolerate two transient lift replans before backtracking
  thin_feature_settle_max_steps: 26
  # A one-step open glitch at grasp->lift is a soft-cost artefact, not release intent.
  # Suppress it while the payload is sensed held; a persistent open command still passes.
  gripper_open_debounce: 2
  # Lift/carry has no release semantics: while hold is physically certified, execute full close.
  hold_gripper_authoritative: true
  predicate_place_transitions: true   # place stages advance on the completion predicate
  plan_authoritative: true            # every plan-authored stage advances on the plan's evidence
grounding:
  rotate_grasp_offset: false
  support_extents: false
  seat_from_plane: true
  lift_latch_xy: false
  subgoal_eps: 0.12
