# Instrumented finding (simple_grip1, 1/10): the pear leg is solved (placed by step 53-103 in
# 10/10) and 3 seeds COMPLETED the task at ~step 150 then sat in the goal state ~1450 steps --
# the terminal release fires only when the VLM constraint reads < subgoal_eps, and 6cm against
# 25-75mm apple perception error never fires. Intermediate stages recover via backtracking; the
# final release has no recovery path. 12cm lets it fire.
