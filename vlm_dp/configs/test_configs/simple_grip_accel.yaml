# simple_grip_accel -- simple_grip_eps12 with ONE change: the new carry_accel term.
#
# Slip forensics (57 slips, this task): objects shear out of a STILL-CLOSED gripper during
# high-acceleration motion, shear(xy)-dominant, mostly in the first ~0.4s after lift; grasp
# placement is identical between configs. Dose-response of P(fall within 5 steps) vs recent
# max |accel|: <=7% below ~2.2 m/s^2, 44-86% above ~3.6 m/s^2. Carry-phase |a|: baseline
# median 1.10 / p90 3.09 m/s^2, grip_eps12 median 2.26-2.59 / p90 ~5.8. grip_eps12 loses grip
# 4.6-5.9x more per carry-minute than the hand-written baseline.
#
# Weight arithmetic: carry_accel is a squared one-sided hinge in m/s^2. At 1.5x the cap
# (3.0 vs 2.0 m/s^2) the excess is 1.0, so the per-step penalty is 1.0^2 = 1.0 and weight 40
# yields 40 -- the same order as carry_hold 40 (whose gripper error is O(1) when it bites).
cost:
  terms:
    rekep_subgoal: 100.0
    rekep_path: 100.0
    center_region: 120.0
    aperture_region: 80.0
    tip_z: 80.0
    grasp_standoff: 40.0
    close_gripper: 2.0
    carry_hold: 40.0
    carry_accel: 40.0
    release_gripper: 40.0
    smooth: 50.4
    joint_delta: 35.0
    floor: 40.0
    straddle: 30.0
    orientation: 8.0
    yaw: 5.0
    grasp_axis: 15.0
  geometry:
    ee_r: 0.035
    coll_clear: 0.02
    finger_r: 0.012
    open_half: 0.04
    tool_back: 0.06
    tcp_to_tip: 0.0
    center_scale: 0.4
    grasp_dead_zone: proportional
    close_z_scale: 0.025
    preshape_z: 0.025
    release_step_motion_cap: 0.004
    retreat_margin: 0.02
    retreat_clear: 0.04
    rise_first_span: 0.05
    rise_first_step: 0.01
    not_hold_sigma: 0.05
    carry_clear_include_placed: true
    carry_clear_margin: 0.005
    preshape_xy_tol: 0.02
    corridor_margin: 0.01
    grasp_approach_cap: 0.008
    grasp_brake_slope: 0.25
    grasp_descend_closing_only: true
    approach_hover: 0.08
    approach_xy_tol: 0.02
    close_xy_floor: 0.008
    aperture_margin: 0.006
    release_xy: 0.06
    release_z: 0.02
