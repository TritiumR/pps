# simple_rekep -- the smallest cost, for any task.
#
# The split: the VLM says WHERE things go, the cost says HOW to touch them. Nothing here
# duplicates or second-guesses the plan.
#
# Assumption, deliberately not defended against: every stage of every plan carries a sub-goal
# rule. We write the plans, so this is ours to guarantee, not something to patch around.
# Verified for all four tasks (weight 6 stages, tea 4, capsule 5, pot 4): no stage is missing
# a sub-goal rule. If that ever breaks, the stage simply has no goal and the failure will be
# obvious -- which is better than a fallback quietly masking a malformed plan.
#
# Consequently dropped:
#   reach, terminal_reach            - fallbacks for a stage the VLM left unspecified
#   lift_reach, place_reach,
#   place_terminal                   - hand-written goals that duplicate rekep_subgoal
#
# rekep_path is kept though every path rule we currently write is constant across candidates
# and so cannot affect the choice: writing a real geometric path rule ("keep the teapot
# upright") is the VLM's job, and this is the only term that would score it.
#
# REQUIRES --vlm_cost rekep_fake_vlm: the old step list discards constraints on grasp and lift
# stages, which under this config would leave them with no goal at all.
cost:
  terms:
    rekep_subgoal: 100.0
    rekep_path: 100.0
    center_region: 120.0
    aperture_region: 80.0
    tip_z: 80.0
    grasp_standoff: 40.0
    close_gripper: 2.0
    carry_hold: 40.0
    release_gripper: 40.0
    smooth: 50.4
    joint_delta: 35.0
    floor: 40.0
  geometry:
    ee_r: 0.035
    coll_clear: 0.02
    finger_r: 0.012
    open_half: 0.04
    tool_back: 0.06
    tcp_to_tip: 0.0
    center_scale: 0.4
    grasp_dead_zone: proportional
    close_z_scale: 0.025
    preshape_z: 0.025
    release_step_motion_cap: 0.004
    retreat_margin: 0.02
    retreat_clear: 0.04
    rise_first_span: 0.05
    rise_first_step: 0.01
    not_hold_sigma: 0.05
    carry_clear_include_placed: true
    carry_clear_margin: 0.005
    preshape_xy_tol: 0.02
    corridor_margin: 0.01
    grasp_approach_cap: 0.008
    grasp_brake_slope: 0.25
    grasp_descend_closing_only: true
    approach_hover: 0.08
    approach_xy_tol: 0.02
    close_xy_floor: 0.008
    aperture_margin: 0.006
    release_xy: 0.06
    release_z: 0.02
    place_approach_margin: 0.01
    release_commit_aniso: true
    commit_measured_gate: true
    release_commit_band: 3.0
    place_descend_radius: 0.08
    place_release_clearance: 0.012
    clear_max_radius: 0.1
advance:
  flag_fallback: false
  release_debug: true
  grasp_advance_on_hold: true
  ground_error_debug: true
grounding:
  rotate_grasp_offset: false
  support_extents: false
  seat_from_plane: true
  lift_latch_xy: false
