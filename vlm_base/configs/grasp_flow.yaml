# Pipeline config for running the ReKep/GT pipeline with Yixuan's grasp_flow cost (--cost grasp_flow).
# Reproduces the validated grasp_flow_clip10 recipe: exec_knot 2 (tight replan), denoise 11, joint clip
# 0.10, the engine-native B-spline (basis linear / knots 0), her sampler noise/temperature. The cost is
# StageGraspFlowCost (Yixuan's GraspFlowStateCost dispatched by the driver's stage); the `cost:` section
# below is unused in this mode (kept so the file also works with --cost composite).

run:
  seed: 1
  max_chunks: 200         # exec_knot 2 executes 2 steps/chunk, so ~4x the chunks for the same reach budget
  fps: 20
  gripper_source: cost    # grasp_flow's close/lift/place_gripper terms drive the gripper (main.py sets this too)
  gripper_in_loop: false

grounding:
  seat_dist: 0.02       # (unused with the cost-driven gripper) latch seat distance
  commit_hold: 5        # closed frames before a grasp commits to the next stage
  advance_persist: 1    # advance the instant grasp_pear fires (like her flag-based dispatch); the lift then
                        # stabilizes the grasp -- debouncing (2) misses the one-chunk flicker and never commits
  clearance: 0.015      # rekep: placement clearance above the surface (m)
  release_tol: 0.05     # rekep: place-stage advance tolerance (m)

engine:
  real_stats: true
  interpolate: true     # engine-native coarse-knot B-spline
  horizon: 15
  exec_knot: 2          # grasp_flow's tight replan (catches the incipient carry-slip)
  mode: denoise
  update: score_space
  init: noise
  warm_steps: 6
  denoise_iters: 11     # grasp_flow value (was 10)
  score_scale: 1.0
  joint_delta_clip: 0.10   # grasp_flow_clip10 value
  basis: linear         # linear + knots 0 => no monkeypatch => the engine's native B-spline (her config path)
  knots: 0

sampler:
  num_samples: 512
  iterations: 8
  noise: 0.5
  temperature: 0.7

# Unused when --cost grasp_flow (StageGraspFlowCost carries Yixuan's own weights); kept for --cost composite.
cost:
  terms:
    reach: 25.0
    terminal_reach: 40.0
    rekep_subgoal: 25.0
    rekep_path: 200.0
    smooth: 0.08
    joint_delta: 0.005
    orientation: 3.0
    consistency: 30.0
    straddle: 30.0
    collision: 20.0
    floor: 40.0
    tip_z: 80.0
    yaw: 5.0
    center_region: 120.0
    aperture_region: 80.0
    close_gripper: 2.0
    carry_hold: 40.0
  geometry:
    ee_r: 0.035
    coll_clear: 0.02
    finger_r: 0.012
    open_half: 0.04
    tool_back: 0.06
    tcp_to_tip: 0.0
    center_scale: 0.40
    aperture_margin: 0.006
    close_z_scale: 0.025
    release_xy: 0.06
    release_z: 0.035
