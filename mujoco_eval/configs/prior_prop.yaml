# base.yaml with the motion scaffold muted, for prior-proposal sampling (--steer inject).
# The scaffold (standoffs, approach caps, brake slopes, rise-first, hold shaping) exists to
# discipline random proposals. When proposals come from a demo-trained proxy those
# behaviours are already in the samples, and the scaffold instead penalises them -- which is
# why inject measured ESS -> (1-rho)*N: injected candidates took ~zero softmax weight.
# Kept: task attractors, collision/floor, gripper actuation, smoothness.
# Muted: aperture_region, carry_hold, center_region, grasp_axis, grasp_standoff, gripper_smooth, not_hold, orientation, release_rise_first, straddle, tip_z, yaw
#
# Derived from: base.yaml
