# base -- the core cost plus B-spline action interpolation. The cost section below is
# byte-identical to core.yaml; only the planner block differs.
#
# Optimizing the 8-row chunk as 4 knots cuts the search dimension 4x, and took stack 11 -> 47/50
# and can 12 -> 34/50 at a fixed sample budget.

cost:
  terms:
    reach: 8.0              # grasp_flow reach (grasp phase; gates off while a payload is held)
    terminal_reach: 40.0    # grasp_flow terminal
    smooth: 5.04            # 0.08 x 7 joints x (H-1); grasp_flow sums, this cost means
    joint_delta: 3.5        # = grasp_flow's local 0.05 x 7 x H=10
    orientation: 8.0        # grasp_flow orient
    straddle: 30.0
    clear: 0.1              # grasp_flow clear (fixtures are never sphere obstacles)
    floor: 40.0
    tip_z: 80.0
    yaw: 5.0                # mild world-axis default (round objects)
    grasp_axis: 15.0        # close across the object's narrow axis when elongated (dominates yaw)
    center_region: 120.0
    aperture_region: 80.0
    close_gripper: 2.0
    carry_hold: 40.0        # grasp_flow lift_gripper / place_gripper
    release_gripper: 40.0   # reopen recovery (closed-empty at target)
    gripper_smooth: 0.5
    lift_reach: 100.0    # consolidated lift attractor (was xy 80 + z 120 + terminal 80 + reach 12)
    place_reach: 100.0   # consolidated place attractor (was 4 separate terms)
    place_terminal: 60.0
    grasp_standoff: 40.0             # contact stack: hover until xy-aligned
    carry_clear: 40.0                # held payload keeps clear of placed objects
    release_rise_first: 1.0          # no lateral travel while low over something already seated
    not_hold: 8.0                    # negate stasis: hold beat the demo at every stage (bench)
  geometry:
    flat_tol: 0.015   # clamp goal/tip_z errors to zero inside this radius, so the acceptable set is FLAT and the sampler holds mass on more than one optimum
    ee_r: 0.035
    coll_clear: 0.02
    finger_r: 0.012
    open_half: 0.04
    tool_back: 0.06
    tcp_to_tip: 0.0
    center_scale: 0.40      # perception-scale dead-zone (grounding error ~17mm >> GT's 6mm zone)
    grasp_dead_zone: proportional   # CONTROL arm: the pre-unification dead-zone
    close_z_scale: 0.025
    preshape_z: 0.025            # close-while-descending: begin close in the cone above the grasp
    release_step_motion_cap: 0.008   # rate-corrected (was 0.004 @ 40 Hz); still ~6cm/s @ 20 Hz
    retreat_margin: 0.02
    retreat_clear: 0.04
    rise_first_span: 0.05
    rise_first_step: 0.02            # rate-corrected (was 0.01 @ 40 Hz)
    not_hold_sigma: 0.05
    carry_clear_include_placed: true
    carry_clear_margin: 0.005        # < seat clearance 0.01 so the apple can reach its own seat
    preshape_xy_tol: 0.02
    corridor_margin: 0.01
    grasp_approach_cap: 0.016       # rate-corrected (was 0.008 @ 40 Hz)
    grasp_brake_slope: 0.50         # rate-corrected (was 0.25 @ 40 Hz)
    place_approach_cap: 0.024       # rate-corrected from the 40 Hz default; unweighted here
    place_brake_slope: 0.50         # rate-corrected from the 40 Hz default; unweighted here
    grasp_descend_closing_only: true   # charge approach, not lateral/retreat (see header)
    approach_hover: 0.08
    approach_xy_tol: 0.02
    close_xy_floor: 0.008   # gate wider than grounding wobble
    aperture_margin: 0.006
    release_xy: 0.06         # xy tolerance of the commitment potential, not a hard edge
    release_z: 0.02          # release near the surface: ~3 cm max set-down
    place_approach_margin: 0.01   # payload underside clearance over the destination's top face
    release_commit_aniso: true    # smooth per-axis commitment instead of the hard AND indicator
    commit_measured_gate: true    # no opening reward until the payload is measurably near the seat
    release_commit_band: 3.0      # measured-gate width, in tolerance units
    place_descend_radius: 0.08      # grasp_flow's binary descend gate
    place_release_clearance: 0.012   # gentle set-down; a 0.04 drop scattered the payload
    clear_max_radius: 0.10          # wider objects are fixtures, not sphere obstacles

# Ablation: no env flag ever touches the control loop (place advance = geometric done() only).
advance:
  flag_fallback: false
  release_debug: true         # log the measured release gate each replan (xy/z, in tolerance units)
  grasp_advance_on_hold: true # a confirmed hold advances the grasp; do not re-gate on the estimate
  ground_error_debug: true    # per-replan drift of the grasp target vs sim pose (logging only)

grounding:
  rotate_grasp_offset: false   # keypoint->centre offset stored/read in the owning body's frame
  support_extents: false       # half-height from the support plane, not the occluded visible span
  seat_from_plane: true       # seat on the dominant flat plane, not the tallest point
  lift_latch_xy: false         # anchor the lift xy at stage entry, not on the live payload

steering:
  # gate_stats: <path>/gate_stats.json   # demo-distribution thresholds for the failure
  #                                      # gate; none ship for MimicGen, so it stays closed
  dwell_k: 2.0

# Isaac-parity planner knobs (opt-in; absent from every other config -> those keep today's path).
planner:
  interpolate: "on"
  interpolation_method: bspline
  interpolate_frequency: 10.0        # Isaac --interpolate_low_frequency
  interpolate_high_frequency: 20.0   # MuJoCo's true action-row rate -> 4 knots of 8, as Isaac
