# VoxPoser config for the PPS / IsaacLab port. Mirrors rlbench_config.yaml (planner,
# controller, LMP prompts/model all unchanged); env_name stays 'rlbench' so the verbatim
# prompts/rlbench/*.txt are loaded. Only the visualizer/recorder save dirs + the recorder
# camera are PPS-specific (overridden per-run by run_voxposer*.py).
env_name: rlbench

planner:
  stop_threshold: 0.001
  savgol_polyorder: 3
  savgol_window_size: 20
  obstacle_map_weight: 1
  max_steps: 300
  obstacle_map_gaussian_sigma: 10
  target_map_weight: 2
  stop_criteria: no_nearby_equal
  target_spacing: 1
  max_curvature: 3
  pushing_skip_per_k: 5

controller:
  horizon_length: 1
  num_samples: 10000
  ee_local: temperature
  ee_local_radius: 0.15

visualizer:
  save_dir: ./results/voxposer
  quality: low
  map_size: 100

recorder:
  save_dir: ./results/voxposer
  fps: 10
  camera: vox_cam_front  # rig camera the rollout video is rendered from
  panel_height: 720
  camera_resolution: 256

lmp_config:
  env:
    map_size: 100
    num_waypoints_per_plan: 10000
    max_plan_iter: 1
    visualize: True
  lmps:
    planner:
      prompt_fname: planner_prompt
      model: gpt-4
      max_tokens: 512
      temperature: 0
      query_prefix: '# Query: '
      query_suffix: '.'
      stop:
        - '# Query: '
        - 'objects = '
      maintain_session: False
      include_context: True
      has_return: False
      return_val_name: ret_val
      load_cache: True
    composer:
      prompt_fname: composer_prompt
      model: gpt-4
      max_tokens: 512
      temperature: 0
      query_prefix: '# Query: '
